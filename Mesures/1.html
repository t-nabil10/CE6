<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1. تذكير: القياس</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body { font-family: "Amiri", "Traditional Arabic", Tahoma, Arial, sans-serif; line-height: 1.8; color: #222; margin: 0; padding: 12px; background: #f0f4f8; word-wrap: break-word; overflow-wrap: break-word; direction: rtl; }
  .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 22px 20px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
  h2 { color: #1a5276; background: #eaf2f8; padding: 10px 14px; border-right: 5px solid #1a5276; border-radius: 4px; margin-top: 26px; font-size: clamp(1rem, 3.8vw, 1.3rem); line-height: 1.3; }
  p, li { font-size: clamp(0.9rem, 3.2vw, 1.05rem); }
  .encadre { background: #e8f8f5; border: 2px solid #16a085; border-radius: 8px; padding: 12px 16px; margin: 15px 0; }
  ul { padding-right: 22px; margin: 8px 0; }
  li { margin: 5px 0; }
  strong { color: #1a5276; }
  .open-link-container { text-align: center; margin: 25px 0 20px; }
  .open-link-btn { background: #2874a6; color: #fff; border: none; padding: 12px 20px; font-size: 1em; border-radius: 8px; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: background 0.2s ease, transform 0.1s ease; max-width: 100%; white-space: normal; line-height: 1.4; font-family: inherit; }
  .open-link-btn:hover { background: #1a5276; transform: translateY(-1px); }
  .open-link-btn i { margin-left: 8px; }
  .footer { text-align: center; margin-top: 30px; font-weight: bold; color: #1a5276; font-size: 1em; }
  @media (max-width: 480px) { body { padding: 8px; } .container { padding: 16px 14px; border-radius: 10px; } h2 { padding: 8px 12px; } .open-link-btn { padding: 10px 14px; font-size: 0.9em; width: 100%; } }
</style>
</head>
<body>
<div class="container">

<h2>1. تذكير: القياس</h2>

<p><strong>القياس</strong> هو تحديد كمية ما باستعمال وحدة مناسبة.</p>

<div class="encadre">
<strong>لكل كمية وحدتها الأساسية:</strong>
<ul>
  <li><strong>الأطوال:</strong> المتر (m).</li>
  <li><strong>الكتل:</strong> الغرام (g).</li>
  <li><strong>المساحات:</strong> المتر المربع (m²).</li>
  <li><strong>سعة التخزين الرقمي:</strong> الأوكتي (octet).</li>
</ul>
</div>

<p class="footer">نهاية الجزء 1 — بالتوفيق للتلاميذ! 🎓</p>

<div class="open-link-container">
    <button class="open-link-btn" onclick="openHtmlPage()">
        <i class="fas fa-window-restore"></i>
        إذا لم تظهر الصفحة بشكل صحيح: اضغط هنا
    </button>
</div>

<script>
  function openHtmlPage() { window.open(window.location.href, '_blank'); }
</script>

</div>
</body>
</html>
