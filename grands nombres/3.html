<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>درس: الأعداد الكبيرة — السادسة ابتدائي</title>
<style>
  body { font-family: "Amiri", "Traditional Arabic", "Times New Roman", serif; background: #f7f7f7; color: #222; line-height: 2; margin: 0; padding: 20px; direction: rtl; }
  .container { max-width: 950px; margin: auto; background: #fff; padding: 30px 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
  h1 { text-align: center; color: #1a4d8f; border-bottom: 3px solid #1a4d8f; padding-bottom: 10px; }
  h2 { color: #1a4d8f; border-right: 5px solid #1a4d8f; padding-right: 10px; margin-top: 30px; background: #eef4fb; padding: 8px 12px; border-radius: 6px; }
  .box { background: #fffbe6; border: 2px dashed #e0b400; padding: 12px 18px; border-radius: 8px; margin: 15px 0; }
  .example { background: #eaf7ea; border-right: 5px solid #2e8b57; padding: 10px 15px; border-radius: 6px; margin: 12px 0; }
  .exercice { background: #f0f0ff; border-right: 5px solid #6a0dad; padding: 12px 18px; border-radius: 8px; margin: 20px 0; }
  /* الجداول تُقرأ من اليسار إلى اليمين */
  table { border-collapse: collapse; margin: 15px auto; width: 100%; text-align: center; direction: ltr; }
  th, td { border: 1px solid #444; padding: 10px; }
  th { background: #1a4d8f; color: #fff; }
  .num { font-family: "Arial", sans-serif; font-size: 1.15em; color: #b30000; font-weight: bold; direction: ltr; unicode-bidi: embed; display: inline-block; }
  ul { padding-right: 25px; }
  .footer { text-align: center; color: #777; font-size: 0.9em; margin-top: 30px; border-top: 1px solid #ccc; padding-top: 10px; }
</style>
</head>
<body>
<div class="container">

 
  <!-- 5 -->
  <h2>3. مقارنة الأعداد الكبيرة</h2>
  <div class="box">
    <strong>القاعدة:</strong>
    <ol>
      <li>نقارن <strong>عدد الأرقام</strong>: الأكثر أرقامًا هو الأكبر.</li>
      <li>إذا تساوى عدد الأرقام، نقارن <strong>رقمًا رقمًا</strong> من اليسار إلى اليمين.</li>
    </ol>
  </div>
  <p><strong>أمثلة:</strong></p>
  <div class="example">
    <span class="num">999 999 999 &lt; 1 000 000 000</span><br>
    <span class="num">5 265 312 000 &gt; 5 265 299 999</span>
  </div>

  
</div>
</body>
</html>
